version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: bb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bb-network

  # RabbitMQ for Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: bb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: bugbounty
      RABBITMQ_DEFAULT_PASS: bugbounty2024
      RABBITMQ_DEFAULT_VHOST: watchtower
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bb-network

  # NestJS Backend API - Development Mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bb-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/bugbounty
      RABBITMQ_URL: amqp://bugbounty:bugbounty2024@rabbitmq:5672/watchtower
      JWT_SECRET: dev-jwt-secret-key
      HACKERONE_API_TOKEN: ${HACKERONE_API_TOKEN:-}
      BUGCROWD_API_TOKEN: ${BUGCROWD_API_TOKEN:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      HEXSTRIKE_URL: http://hexstrike-ai:8888
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - scan_results:/app/results
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - bb-network

  # Subfinder Workers - Scalable workers for parallel subdomain discovery
  # Scale with: docker-compose -f docker-compose.dev.yml up -d --scale subfinder-worker=5
  subfinder-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/bugbounty
      RABBITMQ_URL: amqp://bugbounty:bugbounty2024@rabbitmq:5672/watchtower
      WORKER_ID: subfinder-worker-${HOSTNAME:-default}
    command: ["npm", "run", "start:worker"]
    volumes:
      - ./backend/src:/app/src
      - scan_results:/app/results
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - bb-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Platform Sync Workers - Scalable workers for parallel program sync
  # Scale with: docker-compose -f docker-compose.dev.yml up -d --scale platform-sync-worker=5
  platform-sync-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/bugbounty
      RABBITMQ_URL: amqp://bugbounty:bugbounty2024@rabbitmq:5672/watchtower
      WORKER_ID: platform-sync-worker-${HOSTNAME:-default}
    command: ["npm", "run", "start:platform-sync-worker"]
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - bb-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Subfinder - Subdomain Discovery Tool (for direct CLI usage)
  subfinder:
    image: projectdiscovery/subfinder:latest
    container_name: bb-subfinder
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - scan_results:/results
    networks:
      - bb-network

  # Httpx - HTTP Probing Tool
  httpx:
    image: projectdiscovery/httpx:latest
    container_name: bb-httpx
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - scan_results:/results
    networks:
      - bb-network

  # Nuclei - Vulnerability Scanner
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: bb-nuclei
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - nuclei_templates:/root/nuclei-templates
      - scan_results:/results
    networks:
      - bb-network

  # Katana - Web Crawling/Spidering Tool
  katana:
    image: projectdiscovery/katana:latest
    container_name: bb-katana
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - scan_results:/results
    networks:
      - bb-network

  # HexStrike AI - AI-Powered Penetration Testing Framework
  #hexstrike-ai:
    # build:
    #   context: ./hexstrike-ai
    #   dockerfile: Dockerfile
    # dns:
    #   - 8.8.8.8
    #   - 8.8.4.4
    # container_name: bb-hexstrike-ai
    # restart: unless-stopped
    # environment:
    #   HEXSTRIKE_PORT: 8888
    #   HEXSTRIKE_HOST: 0.0.0.0
    # ports:
    #   - "8888:8888"
    # volumes:
    #   - hexstrike_results:/app/results
    #   - hexstrike_logs:/app/logs
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
    #   interval: 30s
    #   timeout: 9s
    #   retries: 3
    #   start_period: 120s
    # networks:
    #   - bb-network

  # Next.js Frontend - Development Mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bb-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - backend
    networks:
      - bb-network

volumes:
  mongodb_data:
  rabbitmq_data:
  scan_results:
  nuclei_templates:
  hexstrike_results:
  hexstrike_logs:

networks:
  bb-network:
    driver: bridge
